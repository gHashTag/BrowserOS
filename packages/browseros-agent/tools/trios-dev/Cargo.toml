[package]
name = "trios-dev"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "trios-dev"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
colored = "2"
ctrlc = "3"
rand = "0.8"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.40", features = ["full", "rt-multi-thread"] }
tokio-util = "0.7"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
