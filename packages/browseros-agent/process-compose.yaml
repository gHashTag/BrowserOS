version: "0.5"

processes:
  install:
    command: bun install
    availability:
      restart: no

  server:
    # TS server retired — Rust trios-server (gHashTag/trios) is the backend.
    command: sh -c 'cd "${TRIOS_REPO:?set TRIOS_REPO to your trios checkout}" && cargo run -p trios-server'
    availability:
      restart: always
    depends_on:
      install:
        condition: process_completed_successfully

  agent-codegen:
    command: bun --cwd apps/agent codegen --watch
    availability:
      restart: always
    depends_on:
      install:
        condition: process_completed_successfully
