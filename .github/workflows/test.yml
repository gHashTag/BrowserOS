name: Tests

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - .github/workflows/test.yml
      - trios/agent-server/**
  workflow_dispatch:

permissions:
  contents: read

env:
  BROWSEROS_APPIMAGE_URL: https://files.browseros.com/download/BrowserOS.AppImage

jobs:
  test:
    name: Tests / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A REAL POSTGRESQL, BECAUSE THE GATE THAT NEEDS ONE REFUSES TO SKIP.
    #
    # `pg-migrate-live.test.ts` applies MIGRATION_SQL to a scratch database
    # twice and reads the catalog back, and its own comment says why it fails
    # rather than skips when no server is reachable: "a silent skip is how a
    # gate comes to report a success it never earned - this codebase has
    # already shipped one gate that never found its compiler and said nothing."
    #
    # It was right and it was failing: two of the nine red assertions on this
    # branch were this gate saying, correctly, that nothing had applied the
    # migration. The escape hatch TRIOS_PG_MIGRATE_GATE=offline exists, and
    # setting it here would have turned the suite green while making the only
    # gate that asks PostgreSQL about PostgreSQL decorative forever.
    #
    # One service for the whole matrix rather than a separate job: a service
    # container starts in parallel with the checkout and costs seconds, and a
    # second job would duplicate the entire setup - bun, deps, the env file -
    # which is a copy that goes stale, the defect this repository keeps finding.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Without the health check the suite races the database's first boot and
        # fails for a reason that has nothing to do with the migration.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: trios/agent-server
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: server-agent
            command: (cd apps/server && bun run test:agent)
            junit_path: test-results/server-agent.xml
            needs_browser: false
          - suite: server-api
            command: (cd apps/server && bun run test:api)
            junit_path: test-results/server-api.xml
            needs_browser: false
          - suite: server-skills
            command: (cd apps/server && bun run test:skills)
            junit_path: test-results/server-skills.xml
            needs_browser: false
          - suite: server-tools
            command: (cd apps/server && bun run test:tools)
            junit_path: test-results/server-tools.xml
            needs_browser: true
          - suite: server-browser
            command: (cd apps/server && bun run test:browser)
            junit_path: test-results/server-browser.xml
            needs_browser: false
          - suite: server-integration
            command: (cd apps/server && bun run test:integration)
            junit_path: test-results/server-integration.xml
            needs_browser: true
          - suite: server-lib
            command: (cd apps/server && bun run test:lib)
            junit_path: test-results/server-lib.xml
            needs_browser: false
          - suite: server-root
            command: (cd apps/server && bun run test:root)
            junit_path: test-results/server-root.xml
            needs_browser: false
          # ITS OWN GROUP BECAUSE A GROUP IS ITS OWN PROCESS.
          #
          # `pg-migrate-live.test.ts` lived in tests/api and could not work
          # there: `mock.module` is process-global in bun and every test file's
          # module scope is evaluated in one run, so two api files that install
          # a FakePool for `pg` bound the live gate's own import to their fake.
          # Its migration then went nowhere and the catalog came back empty,
          # which reads as a broken migration. It passed alone and failed beside
          # either of them, identically in both orders.
          - suite: server-pglive
            command: (cd apps/server && bun run test:pglive)
            junit_path: test-results/server-pglive.xml
            needs_browser: false
          - suite: agent
            command: (cd apps/agent && bun run test)
            junit_path: test-results/agent.xml
            needs_browser: false
          - suite: eval
            command: (cd apps/eval && bun run test)
            junit_path: test-results/eval.xml
            needs_browser: false
          - suite: shared
            command: (cd packages/shared && bun test --reporter=junit --reporter-outfile="$BROWSEROS_JUNIT_PATH")
            junit_path: test-results/shared.xml
            needs_browser: false
          - suite: cdp-protocol
            command: (cd packages/cdp-protocol && bun test --reporter=junit --reporter-outfile="$BROWSEROS_JUNIT_PATH")
            junit_path: test-results/cdp-protocol.xml
            needs_browser: false
          - suite: build
            command: bun run ./scripts/run-bun-test.ts ./scripts/build
            junit_path: test-results/build.xml
            needs_browser: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      # THE ROUND TESTS HAD BEEN SKIPPING IN CI, EVERY RUN SINCE THEY WERE
      # WRITTEN.
      #
      # `queen-round.test.ts` guards its behaviour cases with `it.if(present)`,
      # where `present` means "the policy binary exists on this machine".
      # Nothing in this workflow ever built it, so all seven skipped and the job
      # reported green - the file that exists BECAUSE nothing in the repository
      # called `runRound`, and that caught a critic deleting the lease guard,
      # was proving nothing at all here.
      #
      # Built with the SAME compiler the Dockerfile uses, so the policy under
      # test is the one Railway ships rather than a lookalike compiled by
      # whatever toolchain a runner happens to carry.
      #
      # DYNAMICALLY LINKED, exactly as Railway builds it, with the runtime
      # lifted out of the image beside it.
      #
      # The first attempt linked dynamically and failed every test with `queend
      # exited 127: error while loading shared libraries` - a bare runner has no
      # `libswiftCore.so`. The obvious repair, `--static-swift-stdlib`, worked
      # and is WRONG here: the static toolchain links
      # `/usr/lib/swift_static/linux/libFoundationEssentials.a`, a different
      # Foundation from the dynamic one, and four daily-cap cases that pass on a
      # dynamic build failed under it. A gate that changes the thing it measures
      # is measuring itself.
      #
      # So the linkage matches production and the runtime travels with the
      # binary. Same sources, same compiler, same Foundation.
      - name: Build the Queen policy binary
        if: matrix.suite == 'server-api'
        run: |
          set -euo pipefail
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$PWD/queen-core":/src \
            -w /src \
            swift:6.0-jammy \
            swift build -c release 2>&1 | tail -30
          # The runtime the binary needs, taken from the image that built it.
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "$PWD/queen-core":/out \
            swift:6.0-jammy \
            sh -c 'mkdir -p /out/.build/swift-runtime && cp -a /usr/lib/swift/linux/*.so* /out/.build/swift-runtime/'
          echo "LD_LIBRARY_PATH=$PWD/queen-core/.build/swift-runtime" >> "$GITHUB_ENV"
          # Assert the artifact, not the exit code: a build that prints an
          # error and still exits 0 would otherwise leave the tests skipping
          # exactly as before, under a step that looked like it had worked.
          test -x queen-core/.build/release/queend
          # And that it can START here, not merely that a file exists. A
          # dynamically linked binary passes the test above and then fails every
          # case with exit 127, which is how the first attempt at this step
          # went.
          #
          # ONLY 127 IS THE FAILURE. The second attempt asserted a clean exit
          # and broke the step itself: `queend` answers a JSON question on
          # stdin, so `--help` and a bare `{}` both exit non-zero by design, and
          # a gate that demanded zero was testing the question rather than the
          # linkage. Any other code means the process ran, which is the whole
          # claim being made.
          set +e
          LD_LIBRARY_PATH="$PWD/queen-core/.build/swift-runtime" \
            sh -c 'printf "{}" | queen-core/.build/release/queend' >/dev/null 2>&1
          started=$?
          set -e
          if [ "$started" -eq 127 ]; then
            echo "queend cannot load its runtime here (exit 127): the build is"
            echo "linked against shared libraries this runner does not have."
            exit 1
          fi

      - name: Resolve BrowserOS cache key
        if: matrix.needs_browser == true
        id: browseros-cache-key
        run: |
          set -euo pipefail
          headers="$(curl -fsSI "$BROWSEROS_APPIMAGE_URL")"
          etag="$(printf '%s\n' "$headers" | awk 'BEGIN{IGNORECASE=1} /^etag:/ {sub(/\r$/, "", $2); gsub(/"/, "", $2); print $2; exit}')"
          last_modified="$(printf '%s\n' "$headers" | awk 'BEGIN{IGNORECASE=1} /^last-modified:/ {$1=""; sub(/^ /, ""); sub(/\r$/, ""); print; exit}')"
          raw_key="${etag:-$last_modified}"
          if [ -z "$raw_key" ]; then
            raw_key="$BROWSEROS_APPIMAGE_URL"
          fi
          cache_key="$(printf '%s' "$raw_key" | shasum -a 256 | awk '{print $1}')"
          echo "key=browseros-appimage-${{ runner.os }}-$cache_key" >> "$GITHUB_OUTPUT"

      - name: Restore BrowserOS cache
        if: matrix.needs_browser == true
        id: browseros-cache
        uses: actions/cache@v4
        with:
          path: trios/agent-server/.ci/bin/BrowserOS.AppImage
          key: ${{ steps.browseros-cache-key.outputs.key }}

      - name: Download BrowserOS
        if: matrix.needs_browser == true && steps.browseros-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .ci/bin
          curl -fsSL "$BROWSEROS_APPIMAGE_URL" -o .ci/bin/BrowserOS.AppImage
          chmod +x .ci/bin/BrowserOS.AppImage

      - name: Prepare BrowserOS wrapper
        if: matrix.needs_browser == true
        run: |
          mkdir -p .ci/bin
          cat > .ci/bin/browseros <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          export APPIMAGE_EXTRACT_AND_RUN=1
          exec "$(dirname "$0")/BrowserOS.AppImage" "$@"
          EOF
          chmod +x .ci/bin/browseros

      - name: Create server env file
        working-directory: trios/agent-server/apps/server
        run: cp .env.example .env.development

      # PROVE THE DATABASE IS REACHABLE FROM THE RUNNER, IN THE RUN'S OWN LOG.
      #
      # The service's container logs say PostgreSQL started. They say nothing
      # about whether this job can reach it, and the difference matters: the
      # live migration gate still failed after the service was added, and
      # without this step there is no way to tell "the runner cannot connect"
      # from "the migration does not create what it promises". Guessing between
      # those two is how a fix gets shipped for the wrong cause.
      #
      # `|| true` because this step is a WITNESS, not a gate. The gate is the
      # test; a probe that fails the job would hide the test's own verdict
      # behind its own.
      - name: Witness the database
        run: |
          echo "psql present: $(command -v psql || echo no)"
          psql "$TRIOS_PG_TEST_URL" -tAc "select 'REACHABLE as '||current_user||' on '||current_database()" || echo "NOT REACHABLE"
        env:
          TRIOS_PG_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

      - name: Run ${{ matrix.suite }} tests
        id: test
        env:
          BROWSEROS_BINARY: ${{ github.workspace }}/trios/agent-server/.ci/bin/browseros
          BROWSEROS_TEST_HEADLESS: "true"
          BROWSEROS_TEST_EXTRA_ARGS: --no-sandbox --disable-dev-shm-usage
          BROWSEROS_JUNIT_PATH: ${{ github.workspace }}/trios/agent-server/${{ matrix.junit_path }}
          # NEVER DATABASE_URL. The live gate creates and drops databases, and
          # its own helper refuses anything that is not loopback for that
          # reason. This is the service container above and nothing else.
          TRIOS_PG_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          set +e
          mkdir -p test-results
          ${{ matrix.command }}
          exit_code=$?
          if [ ! -f "${{ matrix.junit_path }}" ]; then
            if [ "$exit_code" = "0" ]; then
              cat > "${{ matrix.junit_path }}" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites tests="0" failures="0">
            <testsuite name="${{ matrix.suite }}" tests="0" failures="0">
            </testsuite>
          </testsuites>
          EOF
            else
              cat > "${{ matrix.junit_path }}" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites tests="1" failures="1">
            <testsuite name="${{ matrix.suite }}" tests="1" failures="1">
              <testcase classname="workflow" name="${{ matrix.suite }} setup">
                <failure message="Test run failed before JUnit output was written">See workflow logs for details.</failure>
              </testcase>
            </testsuite>
          </testsuites>
          EOF
            fi
          fi
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.suite }}
          path: trios/agent-server/${{ matrix.junit_path }}

      - name: Summarize suite result
        if: always()
        run: |
          if [ "${{ steps.test.outputs.exit_code }}" = "0" ]; then
            echo "### :white_check_mark: ${{ matrix.suite }} suite passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### :x: ${{ matrix.suite }} suite failed (exit code ${{ steps.test.outputs.exit_code }})" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "See the uploaded \`junit-${{ matrix.suite }}\` artifact for details." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  comment:
    name: PR test summary
    needs: test
    if: >-
      always()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      actions: read
    steps:
      - name: Download JUnit artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: junit
          pattern: junit-*

      - name: Build comment body
        run: |
          python3 <<'PY'
          import glob, os, xml.etree.ElementTree as ET

          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          marker = "<!-- browseros-agent-tests-summary -->"

          suites = []
          failed_cases = []
          total_tests = total_failed = total_skipped = 0

          for xml_path in sorted(glob.glob("junit/junit-*/*.xml")):
              suite_name = os.path.basename(os.path.dirname(xml_path)).removeprefix("junit-")
              try:
                  root = ET.parse(xml_path).getroot()
              except ET.ParseError:
                  suites.append({"name": suite_name, "passed": 0, "failed": 1, "skipped": 0, "total": 1})
                  total_tests += 1
                  total_failed += 1
                  failed_cases.append((suite_name, "(could not parse junit XML)"))
                  continue

              testsuites = root.findall("testsuite") if root.tag == "testsuites" else [root]
              s_tests = s_fail = s_err = s_skip = 0
              for ts in testsuites:
                  s_tests += int(ts.get("tests") or 0)
                  s_fail += int(ts.get("failures") or 0)
                  s_err += int(ts.get("errors") or 0)
                  s_skip += int(ts.get("skipped") or 0)
                  for tc in ts.iter("testcase"):
                      if tc.find("failure") is not None or tc.find("error") is not None:
                          cls = tc.get("classname") or ""
                          name = tc.get("name") or "(unnamed)"
                          label = f"{cls} > {name}" if cls else name
                          failed_cases.append((suite_name, label))

              s_failed = s_fail + s_err
              s_passed = max(s_tests - s_failed - s_skip, 0)
              suites.append({"name": suite_name, "passed": s_passed, "failed": s_failed, "skipped": s_skip, "total": s_tests})
              total_tests += s_tests
              total_failed += s_failed
              total_skipped += s_skip

          total_passed = max(total_tests - total_failed - total_skipped, 0)

          if total_tests == 0:
              header = "## :warning: No test results were produced"
          elif total_failed == 0:
              header = f"## :white_check_mark: Tests passed — {total_passed}/{total_tests}"
          else:
              header = f"## :x: Tests failed — {total_failed}/{total_tests} failed"

          lines = [marker, header, ""]
          if suites:
              lines.append("| Suite | Passed | Failed | Skipped |")
              lines.append("|-------|--------|--------|---------|")
              for s in suites:
                  icon = ":white_check_mark:" if s["failed"] == 0 and s["total"] > 0 else ":warning:" if s["total"] == 0 else ":x:"
                  lines.append(f"| {icon} `{s['name']}` | {s['passed']}/{s['total']} | {s['failed']} | {s['skipped']} |")

          if failed_cases:
              lines += ["", "<details open>", "<summary><b>Failed tests</b></summary>", ""]
              for suite_name, label in failed_cases[:50]:
                  lines.append(f"- **{suite_name}** — `{label}`")
              if len(failed_cases) > 50:
                  lines.append(f"- …and {len(failed_cases) - 50} more")
              lines += ["", "</details>"]

          lines += ["", f"[View workflow run]({run_url})"]

          with open("comment.md", "w") as f:
              f.write("\n".join(lines) + "\n")
          PY

      - name: Upsert sticky PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('comment.md', 'utf8');
            const marker = '<!-- browseros-agent-tests-summary -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const triggerSha = context.payload.pull_request.head.sha;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: issue_number });
            if (pr.head.sha !== triggerSha) {
              core.info(`PR head has moved (${pr.head.sha} vs ${triggerSha}) — skipping stale comment.`);
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
