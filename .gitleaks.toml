# Secret gate for gHashTag/BrowserOS. Shared rules: canonical copy in gHashTag/t27 .gitleaks.toml (PR #6433).
# Other gHashTag repos copy the [[rules]] block below; change it here first.
#
# Three layers, each catching what the one before missed:
#   1. lefthook pre-commit  -> gitleaks scans staged changes (lefthook.yml)
#   2. lefthook pre-push    -> gitleaks scans commits not yet on any remote
#   3. CI secret-scan       -> gitleaks scans the PR range; cannot be skipped
#                              with --no-verify (.github/workflows/secret-scan.yml)
# Secrets belong in the environment or in gitignored files, never in the tree.

[extend]
useDefault = true

# The default rules miss Wi-Fi passphrases and other plain passwords.
[[rules]]
id = "hardcoded-password-literal"
description = "Hardcoded password/passphrase string literal (e.g. Wi-Fi credentials in firmware)"
regex = '''(?i)\b[a-z_]*(passphrase|password|passwd|wifi_?pass|psk)[a-z_]*\b["']?\s*[:=]\s*["']([^"'<>${}\s]{6,})["']'''
secretGroup = 2
keywords = ["passphrase", "password", "passwd", "wifi", "psk"]
[[rules.allowlists]]
regexTarget = "match"
regexes = ['''(?i)(your|example|changeme|placeholder|dummy|test|xxx|\*\*\*)''']

[[allowlists]]
description = "Third-party WebBench eval dataset: task prompts carrying benchmark test-site logins, not our credentials"
paths = ['''packages/browseros-agent/apps/eval/data/webbench/[^/]+\.csv''']

[[allowlists]]
description = "Sentry minidump URL key: a public client DSN key, shipped in the browser binary by design"
regexTarget = "line"
regexes = ['''\+\s+"minidump/\?sentry_key=[0-9a-f]{32}";''']

[[allowlists]]
description = "Chrome extension manifest public key (pins the extension ID; not a secret)"
condition = "AND"
paths = ['''packages/browseros-agent/apps/agent/wxt\.config\.ts''']
regexTarget = "line"
regexes = ['''key: '[A-Za-z0-9+/=]{200,}',''']

[[allowlists]]
description = "Verified non-secret lines: npm package name in the lockfile, test fixture string"
regexTarget = "line"
regexes = [
  '''"@inquirer/password": "\^[0-9.]+"''',
  '''extra: \{ password: 'hunter2', note: 'fine' \}''',
]
