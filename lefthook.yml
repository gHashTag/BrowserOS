commit-msg:
  commands:
    conventional:
      run: |
        msg=$(head -1 {1})
        if [[ ! "$msg" =~ ^(feat|fix|docs|style|refactor|perf|test|chore|ci|build|revert)(\(.+\))?\!?:\ .+ ]]; then
          echo "Commit message must follow Conventional Commits format:"
          echo "  <type>(<optional scope>): <description>"
          echo "  Types: feat, fix, docs, style, refactor, perf, test, chore, ci, build, revert"
          echo ""
          echo "Examples:"
          echo "  feat(auth): add OAuth2 support"
          echo "  fix: resolve null pointer exception"
          exit 1
        fi

pre-commit:
  commands:
    biome-check:
      root: "trios/agent-server/"
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: npx @biomejs/biome check --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      stage_fixed: true

    file-length:
      root: "trios/agent-server/"
      glob: "*.{ts,tsx}"
      exclude: "*.{test,spec,d}.ts|*.{test,spec}.tsx|**/__tests__/**|**/tests/**|**/*.generated.*"
      run: |
        for file in {staged_files}; do
          if [[ -f "$file" ]]; then
            lines=$(wc -l < "$file" | tr -d ' ')
            if [[ $lines -gt 400 ]]; then
              echo "⚠️  Warning: $file has $lines lines (threshold: 400)"
              echo "   Consider splitting this file if it has multiple responsibilities."
            fi
          fi
        done

pre-push:
  commands:
    branch-name:
      # POSIX sh, not bash. This used `[[ ]]` and `=~`, which dash does not
      # have. The worker container runs hooks under `sh`, so the script died
      # with `Syntax error: "(" unexpected` and took the push down with it -
      # turning an ADVISORY warning into a hard blocker. Measured 2026-09-04:
      # four bee branches carrying finished work could not reach the remote,
      # and the reported reason was the branch name rather than the syntax.
      #
      # `queen-<issue>` is added because it is a systematic name this repository
      # produces by design, one per dispatched task. A warning that fires on
      # every branch the swarm creates is noise, and noise is what teaches
      # people to ignore a warning that matters.
      run: |
        branch=$(git rev-parse --abbrev-ref HEAD)
        case "$branch" in
          main|master|HEAD) exit 0 ;;
          queen-[0-9]*) exit 0 ;;
          feat/*|fix/*|bugfix/*|hotfix/*|release/*|docs/*|refactor/*|test/*|chore/*|experiment/*) exit 0 ;;
        esac
        echo "Warning: branch name '$branch' does not match the recommended format."
        echo "   Use: <type>/<short-description>, or queen-<issue> for a dispatched task."
        echo "   Types: feat, fix, bugfix, hotfix, release, docs, refactor, test, chore, experiment"
        echo "   This is advice, not a refusal - the push continues."
        exit 0
