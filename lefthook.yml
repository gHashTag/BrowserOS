commit-msg:
  commands:
    english-only:
      run: |
        msg=$(head -1 {1})
        if LC_ALL=C printf '%s' "$msg" | grep -q '[^ -~]'; then
          echo "Commit subjects must be English ASCII."
          exit 1
        fi
    conventional:
      run: |
        msg=$(head -1 {1})
        if [[ ! "$msg" =~ ^(feat|fix|docs|style|refactor|perf|test|chore|ci|build|revert)(\(.+\))?\!?:\ .+ ]]; then
          echo "Commit message must follow Conventional Commits format:"
          echo "  <type>(<optional scope>): <description>"
          echo "  Types: feat, fix, docs, style, refactor, perf, test, chore, ci, build, revert"
          echo ""
          echo "Examples:"
          echo "  feat(auth): add OAuth2 support"
          echo "  fix: resolve null pointer exception"
          exit 1
        fi

pre-commit:
  commands:
    github-task-language:
      run: |
        swiftc trios/tests/swift/queen_language_policy_test.swift \
          trios/rings/SR-00/QueenLanguagePolicy.swift \
          -o /tmp/trios_queen_language_policy_test
        /tmp/trios_queen_language_policy_test
        cmp -s trios/rings/SR-00/QueenLanguagePolicy.swift \
          trios/agent-server/queen-core/Sources/QueenCore/QueenLanguagePolicy.swift || {
          echo "QueenLanguagePolicy mirror differs from the app policy."
          exit 1
        }
    # The agent-server half of the same English-only rule (#1291): the focused
    # test for the TypeScript issue-creation preflight, as a strict gate.
    # `bun test {files}` with `files:` instead of a hardcoded path is deliberate:
    # `lefthook run pre-commit` skips index-watching commands when nothing is
    # staged, so a plain path would make this gate vanish on a clean checkout.
    # Anchoring on `git ls-files` makes it run whenever the test file exists,
    # staged or not. `--full-name` keeps the files command's output
    # repository-relative, which lefthook's root scoping then rewrites to
    # `./apps/...` for the command itself.
    queen-issue-language:
      root: "trios/agent-server/"
      files: git ls-files --full-name apps/server/tests/api/queen-issue-language.test.ts
      run: bun test {files}

    biome-check:
      root: "trios/agent-server/"
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: npx @biomejs/biome check --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      stage_fixed: true

    file-length:
      root: "trios/agent-server/"
      glob: "*.{ts,tsx}"
      exclude: "*.{test,spec,d}.ts|*.{test,spec}.tsx|**/__tests__/**|**/tests/**|**/*.generated.*"
      run: |
        for file in {staged_files}; do
          if [[ -f "$file" ]]; then
            lines=$(wc -l < "$file" | tr -d ' ')
            if [[ $lines -gt 400 ]]; then
              echo "⚠️  Warning: $file has $lines lines (threshold: 400)"
              echo "   Consider splitting this file if it has multiple responsibilities."
            fi
          fi
        done

pre-push:
  commands:
    branch-name:
      run: |
        branch=$(git rev-parse --abbrev-ref HEAD)
        if [[ "$branch" == "main" || "$branch" == "master" ]]; then
          exit 0
        fi
        if [[ ! "$branch" =~ ^(feat|fix|bugfix|hotfix|release|docs|refactor|test|chore|experiment)/[a-z0-9-]+$ ]]; then
          echo "Branch name '$branch' does not match the required format."
          echo "   Use: <type>/<short-description>"
          echo "   Types: feat, fix, bugfix, hotfix, release, docs, refactor, test, chore, experiment"
          echo "   Example: feat/add-auth, fix/login-crash"
          echo ""
          echo "   To rename your branch:"
          echo "     git branch -m <new-name>"
          echo "     git push -u origin <new-name>"
          exit 1
        fi
